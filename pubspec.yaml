name: plusone
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.5.0
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.1
  lottie: ^3.1.2
  video_player: ^2.9.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon+1.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon+1.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/animations/
    - assets/icon/
